name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Checkout base for same-runner comparison
        if: github.event.action != 'closed'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-base

      - name: Install and typecheck base
        if: github.event.action != 'closed'
        working-directory: .ci-base/web
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Compare base and head with identical runtime and assertions
        if: github.event.action != 'closed'
        working-directory: .
        run: |
          output="$RUNNER_TEMP/frontend-comparison"
          mkdir -p "$output"
          for revision in base head; do
            source="$GITHUB_WORKSPACE"
            if [ "$revision" = base ]; then source="$source/.ci-base"; fi
            cd "$source/web"
            set +e
            bun test > "$output/$revision-raw.log" 2>&1
            raw_exit=$?
            bun "$GITHUB_WORKSPACE/web/scripts/test-isolated.mjs" > "$output/$revision-isolated.log" 2>&1
            isolated_exit=$?
            set -e
            printf '%s: raw exit=%s; isolated exit=%s\n' "$revision" "$raw_exit" "$isolated_exit" | tee -a "$GITHUB_STEP_SUMMARY"
            tail -5 "$output/$revision-raw.log" | tee -a "$GITHUB_STEP_SUMMARY"
            tail -1 "$output/$revision-isolated.log" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Test
        run: bun run test

      - name: Upload comparison logs
        if: always() && github.event.action != 'closed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-base-head-comparison
          path: ${{ runner.temp }}/frontend-comparison

  postgres-accounting:
    name: PostgreSQL 16 accounting (${{ matrix.package }})
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: model
            tests: 'TestPostgres|TestSubscriptionReservation|TestTopUpWalletQuota|Test.*PaymentReceipt|TestManualCompleteTopUp'
          - package: service
            tests: 'TestSubscriptionBillingSession|TestBillingSessionRefundIsTerminal'
          - package: controller
            tests: 'TestIFLinkPayHTTP'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cilai_audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: cilai_pr3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cilai_audit -d cilai_pr3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test accounting against disposable PostgreSQL with race detector
        env:
          GOWORK: 'off'
          SQL_DSN: ''
          LOG_SQL_DSN: ''
          CILAI_TEST_POSTGRES_DSN: 'postgres://cilai_audit:isolated-ci-only@127.0.0.1:5432/cilai_pr3_test?sslmode=disable'
          ACCOUNTING_PACKAGE: ${{ matrix.package }}
          ACCOUNTING_TESTS: ${{ matrix.tests }}
        run: go test -race "./$ACCOUNTING_PACKAGE" -run "$ACCOUNTING_TESTS" -count=1 -timeout=120s -v
