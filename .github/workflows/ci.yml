name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in both jobs. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  price-book-migration:
    name: Price book migration (SQLite, MySQL, PostgreSQL)
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: pricebooks_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: pricebooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pricebooks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Exercise real database migration and price selection
        env:
          GOWORK: 'off'
          SQL_DSN: ''
          LOG_SQL_DSN: ''
          PRICE_BOOK_TEST_MYSQL_DSN: 'root:isolated-ci-only@tcp(127.0.0.1:3306)/pricebooks_test?parseTime=true'
          PRICE_BOOK_TEST_POSTGRES_DSN: 'postgres://postgres:isolated-ci-only@127.0.0.1:5432/pricebooks_test?sslmode=disable'
          API_CHANNEL_TEST_MYSQL_DSN: 'root:isolated-ci-only@tcp(127.0.0.1:3306)/pricebooks_test?parseTime=true'
          API_CHANNEL_TEST_POSTGRES_DSN: 'postgres://postgres:isolated-ci-only@127.0.0.1:5432/pricebooks_test?sslmode=disable'
        run: go test ./model -run '^(TestProductPriceBookMigration|TestAPIChannelCatalogDatabaseMatrix)$' -count=1 -timeout=120s -v

  postgres-accounting:
    name: PostgreSQL 16 accounting (${{ matrix.package }})
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: model
            tests: 'TestBillingRefund|TestPostgres|TestSubscriptionReservation|TestTopUp|Test.*PaymentReceipt|TestMonthlyTiersShareOne|TestMonthlyUpgradeKeeps|TestRepeatedPackPurchases|TestValidateV1ContractRejectsFrozenRuleDrift|TestBigfish|TestMarginGuard|TestChannelCost'
          - package: service
            tests: 'TestBillingRefund|TestSubscriptionBillingSession|TestBillingSessionRefundIsTerminal|TestMarginReport'
          - package: controller
            tests: 'TestIFLinkPayHTTP|TestIFLinkPayBigfish|TestBillingRefundHTTP|TestChannelCostVerified|TestStorefrontCatalog'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cilai_audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: cilai_pr3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cilai_audit -d cilai_pr3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test accounting against disposable PostgreSQL with race detector
        env:
          GOWORK: 'off'
          SQL_DSN: ''
          LOG_SQL_DSN: ''
          CILAI_TEST_POSTGRES_DSN: 'postgres://cilai_audit:isolated-ci-only@127.0.0.1:5432/cilai_pr3_test?sslmode=disable'
          ACCOUNTING_PACKAGE: ${{ matrix.package }}
          ACCOUNTING_TESTS: ${{ matrix.tests }}
        run: go test -race "./$ACCOUNTING_PACKAGE" -run "$ACCOUNTING_TESTS" -count=1 -timeout=120s -v
